# 초안 — tjpark79/iv 리포 루트에 project.yml 로 넣습니다.
#
# iv_h 폴더에도 package.json 이 있는데 의존성이 비어 있어 성격을 알 수 없었습니다.
# 무엇인지 확인한 뒤 컴포넌트로 추가하거나, 쓰지 않는다면 지우세요.

id: iv
name: 인터벤처스
status: production
summary: 인터벤처스 웹사이트와 내부 도구

repo:
  owner: tjpark79
  name: iv
  local_dir: iv

domains:
  - inter.vc

components:
  - name: frontend
    kind: web
    path: frontend
    manifest_path: frontend/package.json
    stack:
      runtime: node
      framework: next@16
      ui: react@19
      css: tailwind@4
    hosting:
      platform: vercel
      # TODO: Vercel 프로젝트 이름
      # project: iv

  - name: backend
    kind: api
    path: backend
    manifest_path: backend/requirements.txt
    stack:
      runtime: python
      framework: fastapi@0
      orm: sqlalchemy@2
    hosting:
      platform: railway
      # TODO: Railway 프로젝트/서비스 이름
    env_keys:
      - JWT_SECRET
      - ACCESS_TOKEN_EXPIRE_MINUTES
      - CORS_ORIGINS
      - ADMIN_USERNAME
      - ADMIN_PASSWORD

external_services: []
machines: []

notes: |
  리포에 PRODUCTION_CREDENTIALS.md 가 들어 있다. 레지스트리에는 변수 이름만 적고
  값은 옮기지 않았다. 그 파일이 git 에 커밋돼 있는지 확인이 필요하다.
