# 초안 — tjpark79/iv 리포 루트에 project.yml 로 넣습니다.
#
# iv_h 폴더에도 package.json 이 있는데 의존성이 비어 있어 성격을 알 수 없었습니다.
# 무엇인지 확인한 뒤 컴포넌트로 추가하거나, 쓰지 않는다면 지우세요.

id: iv
name: 인터벤처스
status: production
summary: 인터벤처스 웹사이트와 내부 도구

repo:
  owner: tjpark79
  name: iv
  local_dir: iv

domains:
  - inter.vc

components:
  - name: frontend
    kind: web
    path: frontend
    manifest_path: frontend/package.json
    stack:
      runtime: node
      framework: next@16
      ui: react@19
      css: tailwind@4
    hosting:
      platform: vercel
      # TODO: Vercel 프로젝트 이름
      # project: iv

external_services: []
machines: []

notes: |
  PRODUCTION_CREDENTIALS.md 는 리포 루트에 있지만 .gitignore 로 걸러져 있고
  커밋된 적이 없다 (2026-08-29 확인). 레지스트리에는 값을 옮기지 않는다.

  FastAPI 백엔드(components 의 backend)는 2026-08-29 에 제거했다. 프론트엔드가
  한 번도 호출하지 않는 죽은 코드였고, seed.py 에 팀원 실명과 고객사 명단이
  들어 있어 공개 리포에 둘 수 없었다. git 이력에서도 지웠다.
  로컬 백업은 P/iv-backups/20260829/ 에 있다.
