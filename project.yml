# tjpark79/iv 의 레지스트리 등록 정보 (스키마·규칙은 tjpark79/registry).
# 환경 변수는 **이름만** 적는다. 값·키·접속 문자열은 어떤 경우에도 넣지 않는다.

id: iv
name: 인터벤처스
status: production
summary: 인터벤처스 웹사이트와 내부 도구

repo:
  owner: tjpark79
  name: iv
  local_dir: iv

domains:
  - inter.vc

components:
  - name: frontend
    kind: web
    path: frontend
    manifest_path: frontend/package.json
    stack:
      runtime: node
      framework: next@16
      ui: react@19
      css: tailwind@4
    hosting:
      # Vercel 이 아니다. Hostinger hPanel 의 Git 연동 자동배포로 돈다 —
      # push 하면 pull + npm install + next build + 앱 재시작까지 자동이다.
      # 어댑터가 없는 플랫폼이라 verified_at 으로 사람이 관리한다.
      platform: hostinger
      url: https://inter.vc
      verified_at: '2026-09-05'

external_services: []
machines: []

notes: |
  2026-09-05 에 호스팅 기록을 바로잡았다. vercel 로 적혀 있었는데 실제로는
  Hostinger 다. DNS(가비아 → 217.21.91.124, whois HOSTINGER-HOSTING)·응답
  헤더(server: LiteSpeed)·PROJECT_NOTES.md 넷이 모두 같은 곳을 가리킨다.
  옮긴 시점은 2026-08-16 로 보인다 — 그날 이 Node 앱이 배포되면서 공유
  호스팅의 public_html 이 통째로 새로 쓰였고, 그 안에 있던 ETF 의 시크릿
  파일이 함께 사라진 사건이 etf 쪽에 기록돼 있다.

  Vercel 에 옛 배포가 남아 있는지는 확인하지 못했다. DNS 는 Hostinger 를
  가리키지만 옮기면서 안 지웠다면 그대로 떠 있을 수 있다 — npm run audit
  으로만 드러난다.

  PRODUCTION_CREDENTIALS.md 는 리포 루트에 있지만 .gitignore 로 걸러져 있고
  커밋된 적이 없다 (2026-08-29 확인). 레지스트리에는 값을 옮기지 않는다.

  FastAPI 백엔드(components 의 backend)는 2026-08-29 에 제거했다. 프론트엔드가
  한 번도 호출하지 않는 죽은 코드였고, seed.py 에 팀원 실명과 고객사 명단이
  들어 있어 공개 리포에 둘 수 없었다. git 이력에서도 지웠다.
  로컬 백업은 P/iv-backups/20260829/ 에 있다.
